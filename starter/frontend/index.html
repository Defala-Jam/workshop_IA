<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Tutor</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#0f172a;background:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,960px);height:min(88vh,760px);background:white;border-radius:28px;box-shadow:0 24px 70px #1e293b22;display:grid;grid-template-columns:260px 1fr;overflow:hidden}.side{background:#0f172a;color:white;padding:28px}.side h1{font-size:22px;margin:0 0 8px}.side p{color:#cbd5e1;font-size:14px;line-height:1.5}.metric{margin-top:28px;padding:16px;background:#ffffff10;border:1px solid #ffffff18;border-radius:18px}.metric strong{font-size:26px}.chat{display:flex;flex-direction:column;min-width:0;min-height:0}.messages{flex:1 1 auto;min-height:0;overflow:auto;padding:28px;background:#f8fafc}.msg{max-width:78%;padding:13px 16px;border-radius:18px;margin:8px 0;line-height:1.45;white-space:pre-wrap}.user{margin-left:auto;background:#2563eb;color:white;border-bottom-right-radius:5px}.assistant{background:white;border:1px solid #e2e8f0;border-bottom-left-radius:5px}.composer{display:flex;flex:0 0 auto;gap:10px;padding:18px;border-top:1px solid #e2e8f0}.composer input{flex:1;border:1px solid #cbd5e1;border-radius:14px;padding:13px 15px;font-size:15px}.composer button{border:0;border-radius:14px;padding:0 20px;background:#0f172a;color:white;font-weight:700;cursor:pointer}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.msg{max-width:90%}}
</style></head><body><main class="app"><aside class="side"><h1>Science Tutor</h1><p>Oficina de agentes multimodais com Ollama, LangChain e LangGraph.</p><div class="metric"><div>Score</div><strong id="score">0</strong><div id="attempts">0 tentativas</div></div><p style="margin-top:26px">Experimente:<br>“Quais assuntos posso estudar?”<br><br>“Faça uma pergunta sobre células.”</p></aside><section class="chat"><div class="messages" id="messages"><div class="msg assistant">Olá! Sou o tutor de Ciências. Peça um tema ou uma questão para começar.</div></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Digite uma mensagem…"><button>Enviar</button></form></section></main>
<script>
const threadId=crypto.randomUUID(); const box=document.querySelector('#messages'), input=document.querySelector('#input');
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';add('Pensando…','assistant');const pending=box.lastChild;try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,thread_id:threadId})});const data=await r.json();pending.remove();if(!r.ok)throw new Error(data.detail||'Erro');add(data.message,'assistant');document.querySelector('#score').textContent=data.state?.score??0;document.querySelector('#attempts').textContent=(data.state?.attempts??0)+' tentativas'}catch(err){pending.textContent='Erro: '+err.message}});
</script></body></html>
